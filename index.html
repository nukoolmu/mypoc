<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Interactive Nukool.M Portfolio</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
	<style>
		:root {
			color-scheme: dark;
		}

		body {
			background:
				radial-gradient(circle at 50% 18%, rgba(99, 102, 241, 0.24), transparent 16%),
				radial-gradient(circle at 50% 38%, rgba(34, 211, 238, 0.08), transparent 24%),
				linear-gradient(180deg, #171234 0%, #0b1023 42%, #050814 100%);
		}

		.page-shell {
			background: radial-gradient(circle at top, rgba(255, 255, 255, 0.03), transparent 35%);
		}

		.hero-title {
			background: linear-gradient(90deg, #8fb0ff 0%, #b994ff 45%, #f29dd0 100%);
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}

		.glass-panel {
			background: linear-gradient(180deg, rgba(11, 16, 35, 0.72), rgba(7, 10, 24, 0.92));
			border: 1px solid rgba(255, 255, 255, 0.08);
			backdrop-filter: blur(18px);
			box-shadow: 0 28px 90px rgba(0, 0, 0, 0.48);
		}

		.shadow-glow {
			box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.25), 0 0 28px rgba(34, 211, 238, 0.18);
		}

		.portrait-wrap {
			overflow: visible;
			filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.32));
		}

		.poly-part {
			transform-box: fill-box;
			transform-origin: center;
			transition:
				transform 260ms cubic-bezier(.2,.8,.2,1),
				filter 260ms ease,
				opacity 260ms ease,
				stroke 260ms ease;
			cursor: pointer;
			outline: none;
		}

		.poly-part:hover,
		.poly-part:focus-visible,
		.poly-part.is-active {
			transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(1.045);
			filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.95)) drop-shadow(0 0 28px rgba(34, 211, 238, 0.38));
			stroke: rgba(103, 232, 249, 0.92);
			opacity: 1;
		}

		.zone-group:hover .poly-part {
			opacity: 0.97;
		}

		.zone-glow {
			filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.2));
		}

		.modal-backdrop {
			background: rgba(2, 6, 23, 0.68);
			backdrop-filter: blur(10px);
		}

		.fade-in {
			animation: fadeIn 180ms ease-out;
		}

		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(8px) scale(0.98); }
			to { opacity: 1; transform: translateY(0) scale(1); }
		}

		.chat-answer {
			line-height: 1.7;
			max-height: 140px;
			overflow: auto;
		}

		.prompt-bar {
			background: rgba(11, 16, 35, 0.92);
			border: 1px solid rgba(255, 255, 255, 0.08);
			box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
		}
	</style>
</head>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const modalBackdrop = document.getElementById('modal-backdrop');
			const modalTitle = document.getElementById('modal-title');
			const modalDescription = document.getElementById('modal-description');
			const modalTags = document.getElementById('modal-tags');
			const modalNote = document.getElementById('modal-note');
			const chatInput = document.getElementById('chat-input');
			const chatSend = document.getElementById('chat-send');
			const chatOutput = document.getElementById('chat-output');
			const zoneGroups = document.querySelectorAll('.zone-group');
			let zoneData = {};
			let profile = {};
			let faqList = [];

			function openModal(zoneKey) {
				const zone = zoneData[zoneKey];
				if (!zone) return;

				modalTitle.textContent = zone.title;
				modalDescription.textContent = zone.description;
				modalTags.textContent = (zone.keywords || []).join(' · ');
				modalNote.textContent = zone.note;

				modalBackdrop.classList.remove('hidden');
				modalBackdrop.classList.add('flex');
			}

			function closeModal() {
				modalBackdrop.classList.add('hidden');
				modalBackdrop.classList.remove('flex');
			}

			function normalize(text) {
				return String(text || '').toLowerCase().trim();
			}

			function scoreMatch(query, keywords = []) {
				const normalizedQuery = normalize(query);
				return keywords.reduce((score, keyword) => score + (normalizedQuery.includes(normalize(keyword)) ? 1 : 0), 0);
			}

			function answerQuery(rawQuery) {
				const query = normalize(rawQuery);
				if (!query) {
					return 'พิมพ์คำถามสั้น ๆ ได้เลย เช่น “เล่าเรื่อง face zone” หรือ “what is this page?”';
				}

				if (/(hello|hi|สวัสดี|hey)/i.test(query)) {
					return `สวัสดีครับ ฉันคือ chatbot เล็ก ๆ ของ ${profile.name || 'portfolio นี้'} ลองถามเรื่อง hair, glasses, face, collar, shirt ได้เลย`;
				}

				const exactFaq = faqList.find((faq) => query.includes(normalize(faq.question)) || normalize(faq.question).includes(query));
				if (exactFaq) return exactFaq.answer;

				const zoneEntries = Object.entries(zoneData)
					.map(([key, zone]) => ({ key, zone, score: scoreMatch(query, [key, zone.title, ...(zone.keywords || [])]) }))
					.sort((a, b) => b.score - a.score);

				const bestZone = zoneEntries[0];
				if (bestZone && bestZone.score > 0) {
					return `${bestZone.zone.title}: ${bestZone.zone.description} ${bestZone.zone.note}`;
				}

				if (query.includes('profile') || query.includes('summary') || query.includes('about')) {
					return `${profile.name || 'Profile'} · ${profile.role || ''}. ${profile.summary || ''}`;
				}

				return 'ฉันยังไม่พบคำตอบตรง ๆ จาก YAML ลองใช้คำว่า hair, glasses, face, collar, shirt, profile, หรือ summary นะครับ';
			}

			function renderChatAnswer(question) {
				const answer = answerQuery(question);
				chatOutput.innerHTML = `
					<div class="space-y-2">
						<p class="text-xs uppercase tracking-[0.3em] text-cyan-200/70">Answer</p>
						<p>${answer}</p>
					</div>
				`;
			}

			function wireInteractions() {
				zoneGroups.forEach((group) => {
					const zoneKey = group.dataset.zone;
					group.addEventListener('click', (event) => {
						const target = event.target;
						if (target && target.classList.contains('poly-part')) {
							document.querySelectorAll('.poly-part.is-active').forEach((part) => part.classList.remove('is-active'));
							target.classList.add('is-active');
							openModal(zoneKey);
						}
					});
				});

				modalBackdrop.addEventListener('click', (event) => {
					if (event.target === modalBackdrop) closeModal();
				});

				document.getElementById('modal-close').addEventListener('click', closeModal);
				document.addEventListener('keydown', (event) => {
					if (event.key === 'Escape') closeModal();
				});

				function sendChat() {
					renderChatAnswer(chatInput.value);
				}

				chatSend.addEventListener('click', sendChat);
				chatInput.addEventListener('keydown', (event) => {
					if (event.key === 'Enter') sendChat();
				});

				renderChatAnswer('');
			}

			async function loadYamlData() {
				try {
					const response = await fetch('portfolio-data.yaml', { cache: 'no-store' });
					if (!response.ok) {
						throw new Error(`Failed to load YAML: ${response.status}`);
					}

					const yamlText = await response.text();
					const data = jsyaml.load(yamlText);
					zoneData = data?.zones ?? {};
					profile = data?.profile ?? {};
					faqList = Array.isArray(data?.faqs) ? data.faqs : [];
					wireInteractions();
				} catch (error) {
					chatOutput.innerHTML = '<p class="text-rose-300">ไม่สามารถโหลด `portfolio-data.yaml` ได้ กรุณาเปิดผ่าน local server เช่น Live Server แทนการเปิดไฟล์ตรง ๆ</p>';
					console.error(error);
				}
			}

			loadYamlData();
		});
	</script>
</body>
</html>
