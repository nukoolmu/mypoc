<!DOCTYPE html>
<html lang="th">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Interactive Portfolio Portrait</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdn.jsdelivr.net/npm/js-yaml@4/dist/js-yaml.min.js"></script>
	<style>
		:root {
			color-scheme: dark;
		}

		body {
			background:
				radial-gradient(circle at 50% 18%, rgba(99, 102, 241, 0.24), transparent 16%),
				radial-gradient(circle at 50% 38%, rgba(34, 211, 238, 0.08), transparent 24%),
				linear-gradient(180deg, #171234 0%, #0b1023 42%, #050814 100%);
		}

		.page-shell {
			background: radial-gradient(circle at top, rgba(255, 255, 255, 0.03), transparent 35%);
		}

		.hero-title {
			background: linear-gradient(90deg, #8fb0ff 0%, #b994ff 45%, #f29dd0 100%);
			-webkit-background-clip: text;
			background-clip: text;
			color: transparent;
		}

		.glass-panel {
			background: linear-gradient(180deg, rgba(11, 16, 35, 0.72), rgba(7, 10, 24, 0.92));
			border: 1px solid rgba(255, 255, 255, 0.08);
			backdrop-filter: blur(18px);
			box-shadow: 0 28px 90px rgba(0, 0, 0, 0.48);
		}

		.shadow-glow {
			box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.25), 0 0 28px rgba(34, 211, 238, 0.18);
		}

		.portrait-wrap {
			overflow: visible;
			filter: drop-shadow(0 18px 40px rgba(0, 0, 0, 0.32));
		}

		.poly-part {
			transform-box: fill-box;
			transform-origin: center;
			transition:
				transform 260ms cubic-bezier(.2,.8,.2,1),
				filter 260ms ease,
				opacity 260ms ease,
				stroke 260ms ease;
			cursor: pointer;
			outline: none;
		}

		.poly-part:hover,
		.poly-part:focus-visible,
		.poly-part.is-active {
			transform: translate(var(--dx, 0px), var(--dy, 0px)) scale(1.045);
			filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.95)) drop-shadow(0 0 28px rgba(34, 211, 238, 0.38));
			stroke: rgba(103, 232, 249, 0.92);
			opacity: 1;
		}

		.zone-group:hover .poly-part {
			opacity: 0.97;
		}

		.zone-glow {
			filter: drop-shadow(0 0 12px rgba(34, 211, 238, 0.2));
		}

		.modal-backdrop {
			background: rgba(2, 6, 23, 0.68);
			backdrop-filter: blur(10px);
		}

		.fade-in {
			animation: fadeIn 180ms ease-out;
		}

		@keyframes fadeIn {
			from { opacity: 0; transform: translateY(8px) scale(0.98); }
			to { opacity: 1; transform: translateY(0) scale(1); }
		}

		.chat-answer {
			line-height: 1.7;
			max-height: 140px;
			overflow: auto;
		}

		.prompt-bar {
			background: rgba(11, 16, 35, 0.92);
			border: 1px solid rgba(255, 255, 255, 0.08);
			box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
		}
	</style>
</head>
<body class="min-h-screen text-slate-100">
	<main class="page-shell mx-auto flex min-h-screen max-w-4xl flex-col px-4 py-8 sm:px-6 lg:px-8">
		<section class="flex min-h-screen flex-col items-center justify-between gap-8">
			<div class="w-full text-center pt-8 sm:pt-10">
				<div class="mx-auto inline-flex items-center gap-2 rounded-full border border-white/10 bg-white/5 px-4 py-2 text-xs font-medium uppercase tracking-[0.35em] text-indigo-100/80">
					Interactive Polygon Profile
				</div>
				<h1 class="hero-title mt-5 text-3xl font-extrabold tracking-tight sm:text-5xl">
					Interactive Polygon Profile
				</h1>
				<p class="mx-auto mt-3 max-w-2xl text-sm text-slate-300 sm:text-base">
					คลิกที่ส่วนต่างๆ ของใบหน้าเพื่อดูรายละเอียดส่วนบุคคล
				</p>
			</div>

			<div class="glass-panel w-full max-w-[420px] rounded-[2.25rem] px-4 py-6 sm:px-6 sm:py-8">
				<svg class="portrait-wrap mx-auto w-full max-w-[320px]" viewBox="0 0 720 760" role="img" aria-label="Low poly portrait illustration">
						<defs>
							<linearGradient id="bgGlow" x1="0%" y1="0%" x2="0%" y2="100%">
								<stop offset="0%" stop-color="#0f172a" stop-opacity="0.15" />
								<stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
							</linearGradient>
							<linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
								<stop offset="0%" stop-color="#f8c7a4" />
								<stop offset="52%" stop-color="#e9a781" />
								<stop offset="100%" stop-color="#c87958" />
							</linearGradient>
							<linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
								<stop offset="0%" stop-color="#1f2937" />
								<stop offset="100%" stop-color="#0f172a" />
							</linearGradient>
							<linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
								<stop offset="0%" stop-color="#143c6d" />
								<stop offset="100%" stop-color="#071525" />
							</linearGradient>
							<linearGradient id="collarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
								<stop offset="0%" stop-color="#d9e7f7" />
								<stop offset="100%" stop-color="#aebed1" />
							</linearGradient>
						</defs>

						<rect x="70" y="40" width="580" height="680" rx="44" fill="url(#bgGlow)" opacity="0.95"></rect>
						<circle cx="360" cy="350" r="220" fill="rgba(99,102,241,0.06)"></circle>

						<g class="zone-group" data-zone="hair">
							<polygon class="poly-part" style="fill:url(#hairGrad);stroke:rgba(148,163,184,0.22);stroke-width:2;--dx:-6px;--dy:-12px" points="250,130 300,92 360,80 420,92 470,130 452,178 360,198 268,178"></polygon>
							<polygon class="poly-part" style="fill:#182033;stroke:rgba(148,163,184,0.18);stroke-width:2;--dx:6px;--dy:-10px" points="268,178 360,198 452,178 466,245 360,226 254,245"></polygon>
							<polygon class="poly-part" style="fill:#111827;stroke:rgba(148,163,184,0.18);stroke-width:2;--dx:-8px;--dy:4px" points="254,245 360,226 466,245 434,300 360,290 286,300"></polygon>
							<polygon class="poly-part" style="fill:#0f172a;stroke:rgba(148,163,184,0.18);stroke-width:2;--dx:9px;--dy:6px" points="286,300 360,290 434,300 410,350 360,336 310,350"></polygon>
							<polygon class="poly-part" style="fill:#1e293b;stroke:rgba(148,163,184,0.18);stroke-width:2;--dx:-4px;--dy:10px" points="220,178 268,178 254,245 204,232 190,198"></polygon>
							<polygon class="poly-part" style="fill:#1e293b;stroke:rgba(148,163,184,0.18);stroke-width:2;--dx:4px;--dy:10px" points="520,178 472,178 466,245 516,232 530,198"></polygon>
						</g>

						<g class="zone-group" data-zone="glasses">
							<polygon class="poly-part" style="fill:rgba(7,13,24,0.78);stroke:rgba(103,232,249,0.28);stroke-width:2;--dx:-4px;--dy:2px" points="250,280 310,270 322,308 258,316"></polygon>
							<polygon class="poly-part" style="fill:rgba(7,13,24,0.78);stroke:rgba(103,232,249,0.28);stroke-width:2;--dx:4px;--dy:2px" points="410,270 470,280 462,316 398,308"></polygon>
							<polygon class="poly-part" style="fill:none;stroke:rgba(103,232,249,0.55);stroke-width:3;--dx:0px;--dy:0px" points="322,302 398,302"></polygon>
							<polygon class="poly-part" style="fill:rgba(34,211,238,0.08);stroke:rgba(103,232,249,0.22);stroke-width:1.5;--dx:0px;--dy:4px" points="252,278 300,256 316,274 258,286"></polygon>
							<polygon class="poly-part" style="fill:rgba(34,211,238,0.08);stroke:rgba(103,232,249,0.22);stroke-width:1.5;--dx:0px;--dy:4px" points="420,256 468,278 462,286 404,274"></polygon>
						</g>

						<g class="zone-group" data-zone="face">
							<polygon class="poly-part" style="fill:url(#skinGrad);stroke:rgba(255,255,255,0.14);stroke-width:2;--dx:-3px;--dy:3px" points="300,200 360,170 420,200 446,268 438,370 392,436 360,458 328,436 282,370 274,268"></polygon>
							<polygon class="poly-part" style="fill:#d58f6e;stroke:rgba(255,255,255,0.12);stroke-width:1.8;--dx:-4px;--dy:6px" points="300,200 340,194 330,260 274,268"></polygon>
							<polygon class="poly-part" style="fill:#e7a885;stroke:rgba(255,255,255,0.12);stroke-width:1.8;--dx:4px;--dy:6px" points="420,200 380,194 390,260 446,268"></polygon>
							<polygon class="poly-part" style="fill:#cf7f5d;stroke:rgba(255,255,255,0.12);stroke-width:1.8;--dx:0px;--dy:4px" points="330,260 390,260 402,308 360,326 318,308"></polygon>
							<polygon class="poly-part" style="fill:#b96543;stroke:rgba(255,255,255,0.08);stroke-width:1.5;--dx:0px;--dy:7px" points="318,308 360,326 402,308 392,350 360,372 328,350"></polygon>
							<polygon class="poly-part" style="fill:#f0b693;stroke:rgba(255,255,255,0.08);stroke-width:1.5;--dx:-2px;--dy:10px" points="328,350 360,372 392,350 382,394 360,410 338,394"></polygon>
							<polygon class="poly-part" style="fill:#6f3528;stroke:rgba(255,255,255,0.08);stroke-width:1.2;--dx:0px;--dy:8px" points="344,382 360,392 376,382 360,404"></polygon>
						</g>

						<g class="zone-group" data-zone="collar">
							<polygon class="poly-part" style="fill:url(#collarGrad);stroke:rgba(255,255,255,0.16);stroke-width:2;--dx:-7px;--dy:12px" points="282,458 340,426 360,470 326,512 270,476"></polygon>
							<polygon class="poly-part" style="fill:url(#collarGrad);stroke:rgba(255,255,255,0.16);stroke-width:2;--dx:7px;--dy:12px" points="438,458 380,426 360,470 394,512 450,476"></polygon>
							<polygon class="poly-part" style="fill:#d5e1ef;stroke:rgba(255,255,255,0.14);stroke-width:1.6;--dx:0px;--dy:10px" points="340,426 360,470 326,512 300,462"></polygon>
							<polygon class="poly-part" style="fill:#c2d1e3;stroke:rgba(255,255,255,0.14);stroke-width:1.6;--dx:0px;--dy:10px" points="380,426 360,470 394,512 420,462"></polygon>
						</g>

						<g class="zone-group" data-zone="shirt">
							<polygon class="poly-part" style="fill:url(#shirtGrad);stroke:rgba(56,189,248,0.15);stroke-width:2;--dx:0px;--dy:14px" points="260,490 326,512 360,560 394,512 460,490 510,620 210,620"></polygon>
							<polygon class="poly-part" style="fill:#123055;stroke:rgba(56,189,248,0.14);stroke-width:1.6;--dx:-8px;--dy:20px" points="210,620 260,490 326,512 298,648 236,688 190,650"></polygon>
							<polygon class="poly-part" style="fill:#0c1f36;stroke:rgba(56,189,248,0.14);stroke-width:1.6;--dx:8px;--dy:20px" points="510,620 460,490 394,512 422,648 484,688 530,650"></polygon>
							<polygon class="poly-part" style="fill:#0f2847;stroke:rgba(56,189,248,0.14);stroke-width:1.6;--dx:0px;--dy:18px" points="298,648 360,560 422,648 360,716"></polygon>
						</g>
					</svg>
					<div class="mt-5 text-center">
						<p class="text-sm font-medium text-white">คลิกส่วนใดส่วนหนึ่งเพื่อดูรายละเอียด</p>
						<p class="mt-1 text-xs text-slate-400">Hover เพื่อให้ชิ้น polygon แยกออกเล็กน้อย</p>
					</div>
				</div>

			<div class="w-full max-w-3xl pb-4 sm:pb-6">
				<div class="prompt-bar mx-auto flex flex-col gap-3 rounded-[1.5rem] px-4 py-4 sm:flex-row sm:items-center sm:px-5">
					<div class="flex items-center gap-3 text-slate-300">
						<div class="grid h-10 w-10 shrink-0 place-items-center rounded-full border border-white/10 bg-white/5 text-cyan-200">
							<span class="text-lg">💬</span>
						</div>
						<p class="text-sm font-medium">ถามอะไรได้เกี่ยวกับ Alexander เช่น</p>
					</div>
					<div class="flex flex-1 gap-2">
						<input id="chat-input" type="text" placeholder="ถามอะไรได้เกี่ยวกับ Alexander เช่น..." class="min-w-0 flex-1 rounded-2xl border border-white/10 bg-[#12172c] px-4 py-3 text-sm text-white placeholder:text-slate-500 outline-none transition focus:border-indigo-400/40 focus:ring-2 focus:ring-indigo-400/20" />
						<button id="chat-send" class="rounded-2xl bg-indigo-500 px-5 py-3 text-sm font-semibold text-white transition hover:bg-indigo-400 active:scale-[0.99]">ถาม →</button>
					</div>
				</div>
				<div id="chat-output" class="chat-answer mx-auto mt-3 min-h-[56px] max-w-3xl rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-slate-200"></div>
			</div>
		</section>
	</main>

	<div id="modal-backdrop" class="modal-backdrop fixed inset-0 z-40 hidden items-center justify-center px-4 py-6">
		<div id="modal-panel" class="fade-in relative w-full max-w-2xl rounded-[1.75rem] border border-white/10 bg-slate-950/95 p-6 shadow-2xl shadow-cyan-950/30">
			<button id="modal-close" class="absolute right-4 top-4 grid h-10 w-10 place-items-center rounded-full border border-white/10 bg-white/5 text-lg text-slate-300 transition hover:bg-white/10 hover:text-white" aria-label="Close modal">×</button>
			<p class="text-xs uppercase tracking-[0.35em] text-cyan-200/80">Zone detail</p>
			<h3 id="modal-title" class="mt-2 text-2xl font-semibold text-white"></h3>
			<p id="modal-description" class="mt-4 text-sm leading-7 text-slate-300"></p>
			<div class="mt-6 grid gap-3 sm:grid-cols-2">
				<div class="rounded-2xl border border-white/10 bg-white/5 p-4">
					<p class="text-xs uppercase tracking-[0.3em] text-slate-500">Keywords</p>
					<p id="modal-tags" class="mt-2 text-sm text-slate-200"></p>
				</div>
				<div class="rounded-2xl border border-white/10 bg-white/5 p-4">
					<p class="text-xs uppercase tracking-[0.3em] text-slate-500">Note</p>
					<p id="modal-note" class="mt-2 text-sm text-slate-200"></p>
				</div>
			</div>
		</div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', () => {
			const modalBackdrop = document.getElementById('modal-backdrop');
			const modalTitle = document.getElementById('modal-title');
			const modalDescription = document.getElementById('modal-description');
			const modalTags = document.getElementById('modal-tags');
			const modalNote = document.getElementById('modal-note');
			const chatInput = document.getElementById('chat-input');
			const chatSend = document.getElementById('chat-send');
			const chatOutput = document.getElementById('chat-output');
			const zoneGroups = document.querySelectorAll('.zone-group');
			let zoneData = {};
			let profile = {};
			let faqList = [];

			function openModal(zoneKey) {
				const zone = zoneData[zoneKey];
				if (!zone) return;

				modalTitle.textContent = zone.title;
				modalDescription.textContent = zone.description;
				modalTags.textContent = (zone.keywords || []).join(' · ');
				modalNote.textContent = zone.note;

				modalBackdrop.classList.remove('hidden');
				modalBackdrop.classList.add('flex');
			}

			function closeModal() {
				modalBackdrop.classList.add('hidden');
				modalBackdrop.classList.remove('flex');
			}

			function normalize(text) {
				return String(text || '').toLowerCase().trim();
			}

			function scoreMatch(query, keywords = []) {
				const normalizedQuery = normalize(query);
				return keywords.reduce((score, keyword) => score + (normalizedQuery.includes(normalize(keyword)) ? 1 : 0), 0);
			}

			function answerQuery(rawQuery) {
				const query = normalize(rawQuery);
				if (!query) {
					return 'พิมพ์คำถามสั้น ๆ ได้เลย เช่น “เล่าเรื่อง face zone” หรือ “what is this page?”';
				}

				if (/(hello|hi|สวัสดี|hey)/i.test(query)) {
					return `สวัสดีครับ ฉันคือ chatbot เล็ก ๆ ของ ${profile.name || 'portfolio นี้'} ลองถามเรื่อง hair, glasses, face, collar, shirt ได้เลย`;
				}

				const exactFaq = faqList.find((faq) => query.includes(normalize(faq.question)) || normalize(faq.question).includes(query));
				if (exactFaq) return exactFaq.answer;

				const zoneEntries = Object.entries(zoneData)
					.map(([key, zone]) => ({ key, zone, score: scoreMatch(query, [key, zone.title, ...(zone.keywords || [])]) }))
					.sort((a, b) => b.score - a.score);

				const bestZone = zoneEntries[0];
				if (bestZone && bestZone.score > 0) {
					return `${bestZone.zone.title}: ${bestZone.zone.description} ${bestZone.zone.note}`;
				}

				if (query.includes('profile') || query.includes('summary') || query.includes('about')) {
					return `${profile.name || 'Profile'} · ${profile.role || ''}. ${profile.summary || ''}`;
				}

				return 'ฉันยังไม่พบคำตอบตรง ๆ จาก YAML ลองใช้คำว่า hair, glasses, face, collar, shirt, profile, หรือ summary นะครับ';
			}

			function renderChatAnswer(question) {
				const answer = answerQuery(question);
				chatOutput.innerHTML = `
					<div class="space-y-2">
						<p class="text-xs uppercase tracking-[0.3em] text-cyan-200/70">Answer</p>
						<p>${answer}</p>
					</div>
				`;
			}

			function wireInteractions() {
				zoneGroups.forEach((group) => {
					const zoneKey = group.dataset.zone;
					group.addEventListener('click', (event) => {
						const target = event.target;
						if (target && target.classList.contains('poly-part')) {
							document.querySelectorAll('.poly-part.is-active').forEach((part) => part.classList.remove('is-active'));
							target.classList.add('is-active');
							openModal(zoneKey);
						}
					});
				});

				modalBackdrop.addEventListener('click', (event) => {
					if (event.target === modalBackdrop) closeModal();
				});

				document.getElementById('modal-close').addEventListener('click', closeModal);
				document.addEventListener('keydown', (event) => {
					if (event.key === 'Escape') closeModal();
				});

				function sendChat() {
					renderChatAnswer(chatInput.value);
				}

				chatSend.addEventListener('click', sendChat);
				chatInput.addEventListener('keydown', (event) => {
					if (event.key === 'Enter') sendChat();
				});

				renderChatAnswer('');
			}

			async function loadYamlData() {
				try {
					const response = await fetch('portfolio-data.yaml', { cache: 'no-store' });
					if (!response.ok) {
						throw new Error(`Failed to load YAML: ${response.status}`);
					}

					const yamlText = await response.text();
					const data = jsyaml.load(yamlText);
					zoneData = data?.zones ?? {};
					profile = data?.profile ?? {};
					faqList = Array.isArray(data?.faqs) ? data.faqs : [];
					wireInteractions();
				} catch (error) {
					chatOutput.innerHTML = '<p class="text-rose-300">ไม่สามารถโหลด `portfolio-data.yaml` ได้ กรุณาเปิดผ่าน local server เช่น Live Server แทนการเปิดไฟล์ตรง ๆ</p>';
					console.error(error);
				}
			}

			loadYamlData();
		});
	</script>
</body>
</html>
