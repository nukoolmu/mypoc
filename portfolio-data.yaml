profile:
  name: "Nukool Muangsoon"
  nickname: "Ra"
  role: "IT Specialist Team Leader"
  summary: "A minimalist portrait built from symmetric low-poly geometry, designed to demonstrate motion, interaction, and data-driven UI in a single HTML file."

zones:
  hair:
    en:
      title: "Backgound"
      description: "I was born in 1991 in Sukhothai, Thailand. I have a strong passion for technology, design, and music. In 2012, I graduated with a Bachelor's degree in Computer Science from North Bangkok University and have been working in the IT field ever since. My career includes 3 years as an IT Operations at Kasikornbank (outsourced via MFEC) and another 3 years as an IT Outsourcing System engineer at AIS. Subsequently, I was promoted to IT Specialist Team Leader at AIS, a position I currently hold."
      keywords: ["background", "role", "responsibility", "experience", "crown"]
    th:
      title: "ประวัติพื้นหลัง"
      description: "เกิดปี 2534 ที่จังหวัดสุโขทัย ประเทศไทย มีความสนใจอย่างมากในด้านเทคโนโลยี ดีไซน์ และเพลง สำเร็จการศึกษาปี 2555 ด้านวิทยาศาสตร์คอมพิวเตอร์จากมหาวิทยาลัยหัวเมืองเหนือ และเป็นระยะเวลามากกว่า 10 ปีในการทำงานในด้านไอที มีประสบการณ์ 3 ปีเป็น IT Operations ที่ธนาคารกสิกรไทย (outsourced via MFEC) และอีก 3 ปีเป็น IT Outsourcing System Engineer ที่ AIS จากนั้นได้เลื่อนตำแหน่งเป็น IT Specialist Team Leader ในตำแหน่งปัจจุบัน"
      keywords: ["ประวัติ", "บทบาท", "ความรับผิดชอบ", "ประสบการณ์", "พื้นหลัง", "เกี่ยวกับฉัน"]
  glasses:
    en:
      title: "Hobby"
      description: "Beyond my technical career, I am a passionate graphic designer, rapper, and home cook. I have a deep love for design and music, particularly enjoying creating cartoon characters and logos. In my free time, I love experimenting with new recipes and cooking techniques."
      note: "A Rapper A.K.A czman , Graphic Designer A.K.A froncduche"
      keywords: ["Hobby", "softskill", "focus", "vision", "detail"]
    th:
      title: "งานอดิเรก"
      description: "นอกจากการทำงานด้านเทคโนโลยี ฉันเป็นนักออกแบบกราฟิก rapper และนักปรุงอาหาร มีความรักและหลงใหลในด้านดีไซน์และเพลง โดยเฉพาะการออกแบบตัวการ์ตูนและโลโก้ ในเวลาว่างฉันชอบทดลองสูตรอาหารใหม่ ๆ และเทคนิคการปรุงอาหาร"
      note: "Rapper ชื่อเล่น czman, Graphic Designer ชื่อเล่น froncduche"
      keywords: ["งานอดิเรก", "ทักษะนอกเหนือ", "เน้น", "วิสัยทัศน์", "รายละเอียด"]
  face:
    en:
      title: "technical Skill"
      description: "I am a Tech Transformation and Innovation Enthusiast with a strong background in DevOps, Cloud Computing, and IT Infrastructure. I specialize in designing and managing high-performance computer systems and networks, ensuring optimal efficiency, security, and reliability. Leveraging my expertise in software development, I build innovative, user-centric solutions that drive digital transformation."
      note: "Jenkins, GitLab, GitHub, Docker, Kubernetes, AWS, Azure, Oracle, Linux, Windows Server, ELK, Prometheus, Grafana,Ansible, Terraform, Bash"
      keywords: ["technology", "skill", "experience", "tech", "identity"]
    th:
      title: "ทักษะทางเทคนิค"
      description: "ฉันเป็นผู้ที่มีความสนใจและหลงใหลในการแปลงเทคโนโลยีและนวัตกรรม มีพื้นฐานความรู้ที่มั่นคงในด้าน DevOps, Cloud Computing และ IT Infrastructure ฉันเชี่ยวชาญในการออกแบบและบริหารจัดการระบบคอมพิวเตอร์และเครือข่ายประสิทธิภาพสูง เพื่อให้มั่นใจได้ว่าการทำงานที่เหมาะสมที่สุด ความปลอดภัย และความเชื่อถือได้ โดยใช้ประสบการณ์ด้านการพัฒนาซอฟต์แวร์ ฉันสร้างสารแก้ปัญหาที่เป็นนวัตกรรมและเน้นผู้ใช้ที่ขับเคลื่อนการแปลงเทคโนโลยีดิจิทัล"
      note: "Jenkins, GitLab, GitHub, Docker, Kubernetes, AWS, Azure, Oracle, Linux, Windows Server, ELK, Prometheus, Grafana, Ansible, Terraform, Bash"
      keywords: ["เทคโนโลยี", "ทักษะ", "ประสบการณ์", "เทค", "เอกลักษณ์"]
  collar:
    en:
      title: "Innovation"
      description: "To overcome VM scaling limitations, I architected OC-Loadtester—a hyperscale load-testing simulator leveraging distributed JMeter within a microservices framework. Additionally, I conceptualized and deployed an integrated deployment pipeline combining rolling update strategies with A/B testing capabilities."
      note: "As the sole creator and architect of OC-Loadtester, I took on the challenge of ensuring zero-downtime, fully automated deployments. To achieve this, I conceptualized and engineered an absolute continuous deployment framework that seamlessly handles release management."
      keywords: ["Innovation", "idea", "creative", "structure"]
    th:
      title: "นวัตกรรม"
      description: "เพื่อแก้ปัญหาข้อจำกัดของ VM scaling ฉันได้สร้าง OC-Loadtester ซึ่งเป็นเครื่องจำลองการทดสอบภาระงานขนาดใหญ่ โดยใช้ประโยชน์จาก JMeter แบบกระจายภายในกรอบงาน microservices นอกจากนี้ ฉันยังได้วางแผนและปรับใช้ pipeline การปรับใช้ที่บูรณาการรวมกลยุทธ์การอัพเดทแบบค่อยเป็นค่อยไปและความสามารถในการทดสอบ A/B"
      note: "ในฐานะผู้สร้างและสถาปนิกเพียงคนเดียวของ OC-Loadtester ฉันได้รับความท้าทายในการรับประกันการปรับใช้ที่ไม่มีการหยุดและทั้งหมดอัตโนมัติ เพื่อให้บรรลุเป้าหมายนี้ ฉันได้วางแผนและออกแบบกรอบการปรับใช้อย่างต่อเนื่องที่จัดการการออกรุ่นอย่างราบรื่น"
      keywords: ["นวัตกรรม", "ความคิด", "สร้างสรรค์", "โครงสร้าง"]
  shirt:
    en:
      title: "strong and weak point"
      description: "Professional Strengths. Strong analytical and problem-solving skills with a systematic approach to complex technical challenges. High ownership, accountability, and a strong commitment to delivering results. Experienced in leading teams, improving collaboration, and driving continuous improvement. Fast learner with a strong interest in emerging technologies, AI, cloud infrastructure, and automation. Adaptable, proactive, and comfortable working in fast-paced and changing environments."
      note: "Development Areas. Continuously improving prioritization and delegation to maintain focus across multiple initiatives. Developing stronger strategic communication and stakeholder management skills for broader leadership responsibilities. Further strengthening professional English communication for global and cross-cultural environments."
      keywords: ["strong", "weak", "improvement", "base", "professional"]
    th:
      title: "จุดแข็งและจุดอ่อน"
      description: "จุดแข็ง ทักษะการวิเคราะห์และแก้ปัญหาที่เข้มแข็ง พร้อมแนวทางการจัดการที่เป็นระบบในการเผชิญความท้าทายทางเทคนิคที่ซับซ้อน ความเป็นเจ้าของงาน ความรับผิดชอบ และความมุ่งมั่นที่แข็งแกร่งในการนำเสนอผลลัพธ์ มีประสบการณ์ในการนำทีม การปรับปรุงความร่วมมือ และการขับเคลื่อนการปรับปรุงอย่างต่อเนื่อง ผู้เรียนรู้ได้เร็วที่มีความสนใจเป็นอย่างมากในเทคโนโลยีที่เกิดขึ้นใหม่ AI โครงสร้างพื้นฐานระบบคลาวด์ และการอัตโนมัติ มีความยืดหยุ่น เป็นผู้ริเริ่ม และสามารถทำงานได้อย่างสบายใจในสภาวะการทำงานที่เปลี่ยนแปลงอย่างรวดเร็ว"
      note: "พื้นที่พัฒนา การปรับปรุงลำดับความสำคัญและการมอบหมายงานอย่างต่อเนื่องเพื่อรักษาการมุ่งเน้นในมูลค่าหลายอย่าง การพัฒนาการสื่อสารเชิงกลยุทธ์ที่เข้มแข็งขึ้นและทักษะการจัดการผู้มีส่วนได้ส่วนเสียสำหรับความรับผิดชอบด้านการนำที่กว้างขึ้น การเพิ่มพูนความสามารถในการสื่อสารภาษาอังกฤษเชิงวิชาชีพสำหรับสภาพแวดล้อมระดับโลกและข้ามวัฒนธรรม"
      keywords: ["แข็ง", "อ่อน", "การปรับปรุง", "พื้นฐาน", "มืออาชีพ"]


faqs:
  # English - General & Navigation
  - question: "what is this page"
    answer: "This is a single-file portfolio prototype that combines an interactive polygon portrait, a detail modal, and a tiny chatbot powered by one shared YAML dataset."
  - question: "how does hover work"
    answer: "Each polygon piece has a small custom translation vector, so hovering creates an exploded-view effect with cyan glow and smooth transitions."
  - question: "how do i open details"
    answer: "Click any polygon area. The modal reads content from the YAML database and displays the matching zone information."
  - question: "what can the chatbot answer"
    answer: "It can answer questions about the portrait zones, profile summary, and the interaction behavior using keyword matching against the YAML data."

  # English - Profile Information
  - question: "who are you"
    answer: "I'm Nukool Muangsoon, an IT Specialist Team Leader with a passion for technology, design, and music. I'm also known as 'Ra' among friends and family."
  - question: "what is your full name"
    answer: "My full name is Nukool Muangsoon. My nickname is 'Ra'."
  - question: "what is your current role"
    answer: "I am an IT Specialist Team Leader at AIS, responsible for overseeing system and IT infrastructure management."
  - question: "where were you born"
    answer: "I was born in 1991 in Sukhothai, Thailand."
  - question: "what is your background"
    answer: "I graduated in 2012 with a Bachelor's degree in Computer Science from North Bangkok University. I have 3+ years as IT Operations at Kasikornbank and 3+ years as IT Outsourcing System Engineer at AIS, then promoted to IT Specialist Team Leader."
  
  # English - Technical Skills
  - question: "what are your technical skills"
    answer: "I specialize in DevOps, Cloud Computing, and IT Infrastructure. Key tools: Jenkins, GitLab, GitHub, Docker, Kubernetes, AWS, Azure, Oracle, Linux, Windows Server, ELK, Prometheus, Grafana, Ansible, Terraform, Bash."
  - question: "devops skills"
    answer: "Jenkins, GitLab, GitHub, Docker, Kubernetes, Ansible, Terraform, continuous integration and deployment pipelines."
  - question: "cloud platforms"
    answer: "AWS and Azure are my primary cloud platforms for infrastructure design and management."
  - question: "monitoring and logging"
    answer: "I use ELK Stack (Elasticsearch, Logstash, Kibana), Prometheus, and Grafana for system monitoring and analytics."
  
  # English - Innovation & Projects
  - question: "what is oc-loadtester"
    answer: "OC-Loadtester is my architecture innovation—a hyperscale load-testing simulator using distributed JMeter within a microservices framework. I architected it to overcome VM scaling limitations and ensure zero-downtime automated deployments."
  - question: "your major innovation"
    answer: "I conceptualized an integrated deployment pipeline combining rolling updates with A/B testing, and architected OC-Loadtester for hyperscale load testing and continuous deployment."
  
  # English - Hobbies & Soft Skills
  - question: "what are your hobbies"
    answer: "I'm a graphic designer, rapper (stage name: czman), and home cook. I love creating cartoon characters and logos, making music, and experimenting with new recipes."
